[theme]
# Czerwień PFM (wyciągnięta z logo, lekko pogłębiona dla kontrastu na białym).
primaryColor = "#D81F26"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F7F9"
textColor = "#16181D"
font = "sans serif"

[server]
# Logo upload max 5 MB — wystarcza na PNG/JPG, eliminuje sensowny abuse 200MB.
maxUploadSize = 5
