name: keep-alive

# Budzi/utrzymuje prod (protocol.streamlit.app), żeby uniknąć ~3-min cold bootu
# przy wejściu.
#
# CZĘSTOTLIWOŚĆ — dlaczego co 2 h, a nie co 30 min (zmiana przy przejściu repo
# na prywatne): repozytoria publiczne mają minuty Actions za darmo bez limitu,
# prywatne dostają 2000 minut miesięcznie, a GitHub zaokrągla KAŻDE zadanie
# w górę do pełnej minuty. Co 30 min = 1440 przebiegów/mies. = co najmniej
# 1440 minut, czyli ocieranie się o limit. Co 2 h = ~360 przebiegów (~360-720
# min), z wygodnym zapasem. Aplikacja i tak nie zdąży zasnąć między pingami.
# Gdyby repo wróciło na publiczne, można spokojnie zejść z powrotem do */30.
#
# UWAGA: zdarzenie `schedule` odpala się TYLKO z domyślnego brancha (main).
# Ten plik musi być na `main`, inaczej cron nie wystartuje.

on:
  schedule:
    - cron: "0 */2 * * *"    # co 2 godziny (UTC)
  workflow_dispatch:           # ręczne odpalenie z zakładki Actions

permissions:
  contents: read

# Nie kolejkuj nakładających się przebiegów.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright (pip)
        run: |
          pip install playwright
          echo "PW_VERSION=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_ENV"

      # Cache przeglądarki. Bez tego KAŻDY przebieg (48 dziennie) ściągał
      # Chromium od nowa z cdn.playwright.dev — a ten CDN bywa niedostępny
      # z regionów, w których lądują runnery GitHuba (HTTP 403 "this service
      # is not available in your location"). To był powód czerwonych maili
      # z 6 i 8 sierpnia. Z cache'em w typowym przebiegu nie ma pobierania.
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PW_VERSION }}

      - name: Install Chromium
        id: install
        # Nie wywalamy całego przebiegu, gdy CDN akurat nie odpowiada:
        # pominięty ping jest nieszkodliwy (najwyżej następny użytkownik
        # poczeka na zimny start), a czerwone CI to tylko zbędny mail.
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            if python -m playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Pobieranie Chromium nie powiodło się (próba $i/3)."
            sleep $((i * 20))
          done
          echo "::warning::CDN Playwrighta niedostępny — pomijam ten ping."
          exit 1

      - name: Ping / wake prod
        if: steps.install.outcome == 'success'
        run: python scripts/keepalive.py
